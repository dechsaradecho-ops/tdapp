services:
  # FastAPI backend
  - type: web
    name: tdapp-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
    # AI config (provider + key) อยู่ใน Secret File: ai.config.json
    # (Dashboard → tdapp-api → Environment → Secret File → path: ai.config.json)

  # Background workers (scanner, news, monitor, notifier)
  - type: worker
    name: tdapp-workers
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.run_all
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
    # AI config (provider + key) อยู่ใน Secret File: ai.config.json

  # Next.js frontend
  - type: web
    name: tdapp-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # Redis cache (ยังไม่ถูกใช้ในโค้ด — ปิดไว้ก่อนเพื่อไม่เสียค่าใช้จ่าย)
  # เปิดเมื่อไหร่: พอมีการใช้ cache/queue จริง แล้วตั้ง REDIS_URL ผ่าน Secret File หรือ env var
  # - type: redis
  #   name: tdapp-redis
  #   plan: starter
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []
