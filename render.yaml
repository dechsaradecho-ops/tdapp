services:
  # FastAPI backend
  - type: web
    name: tdapp-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # รัน background workers ในตัว web service นี้ (อย่าเปิดซ้ำที่ service อื่น)
      - key: ENABLE_WORKERS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      # Bot's own user ID (U...) — @mention detection in group chats
      - key: LINE_BOT_USER_ID
        sync: false
      # ราคาทอง XAU/USD ผ่าน Twelve Data (free key) — FX ใช้ Frankfurter ไม่ต้องมี key
      - key: TWELVEDATA_API_KEY
        sync: false
    # AI provider/url อยู่ในไฟล์ ai.config.json (non-secret, ใส่ใน repo ได้)
    # AI_API_KEY เป็น env var — ใส่ใน Dashboard → Environment

  # Background workers (scanner, news, monitor, notifier)
  - type: worker
    name: tdapp-workers
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.run_all
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_BOT_USER_ID
        sync: false
      # scanner ต้องใช้ key เดียวกับ api — ดึงราคาทอง XAU/USD จาก Twelve Data
      - key: TWELVEDATA_API_KEY
        sync: false
    # AI provider/url อยู่ในไฟล์ ai.config.json (non-secret)
    # AI_API_KEY เป็น env var — ใส่ใน Dashboard → Environment

  # Next.js frontend — Static Site (npm run build → publish out/)
  # คง static site เดิมไว้ (tdappstatic.onrender.com) — user ไม่ต้องการ Web Service ใหม่
  # หมายเหตุ: static publish ช้ากว่า node service (~10 นาที vs ~2-3 นาที)
  - type: web
    name: tdapp-web
    runtime: static
    rootDir: frontend
    plan: starter
    buildCommand: npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
    routes:
      # SPA fallback: ทุก path ส่ง index.html (ยกเว้นไฟล์ static ที่มีอยู่จริง)
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis cache (ยังไม่ถูกใช้ในโค้ด — ปิดไว้ก่อนเพื่อไม่เสียค่าใช้จ่าย)
  # เปิดเมื่อไหร่: พอมีการใช้ cache/queue จริง แล้วตั้ง REDIS_URL ผ่าน Secret File หรือ env var
  # - type: redis
  #   name: tdapp-redis
  #   plan: starter
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []
